<!--
Web analytics for the gitbook (HTML) build only, injected into the <head> of
every chapter page via `includes: in_header` under `bookdown::gitbook` in
_output.yml. The PDF and epub builds do not include this file.

GoatCounter is used rather than Google Analytics because it sets no cookies and
stores no personal data, so the book needs no consent banner for readers in the
EU. See https://www.goatcounter.com/help/privacy for what is and is not
collected.

The site code below, `caseywdunn`, is deliberately the same one the lab website
uses, which it sets in `goatcounter:` in _config.yml of the caseywdunn.github.io
repository. Both sites are served under dunnlab.org, so one code puts them in a
single dashboard where the URL path separates them: the book is everything under
/phylogenetic_biology/, one row per chapter. Keep the two in sync. The code is
not a secret; it is visible in the page source of every site that uses it.

Local previews are not counted: count.js ignores hits from localhost, private
address ranges, and file:// URLs unless allow_local is set. No separate
development/production gate is needed here.
-->
<script data-goatcounter="https://caseywdunn.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
